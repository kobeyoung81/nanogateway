<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="nanogateway: five channels in, four services out">
  <title>nanogateway</title>
  <defs>
    <style>
      .txt { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      .chip { fill: #F1F5F9; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; }
      .wire { stroke: #CBD5E1; stroke-width: 2; }
      .ink { fill: #0F172A; }
      .dim { fill: #64748B; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#FFFFFF"/>

  <g class="txt" font-size="13" fill="#334155">
    <rect class="chip" x="56" y="40" width="160" height="36" rx="10"/><text x="136" y="63" text-anchor="middle">Web chat</text>
    <rect class="chip" x="228" y="40" width="160" height="36" rx="10"/><text x="308" y="63" text-anchor="middle">WeCom</text>
    <rect class="chip" x="400" y="40" width="160" height="36" rx="10"/><text x="480" y="63" text-anchor="middle">Feishu</text>
    <rect class="chip" x="572" y="40" width="160" height="36" rx="10"/><text x="652" y="63" text-anchor="middle">WeChat KF</text>
    <rect class="chip" x="744" y="40" width="160" height="36" rx="10"/><text x="824" y="63" text-anchor="middle">CLI</text>
  </g>

  <g class="wire">
    <line x1="136" y1="76" x2="136" y2="105"/>
    <line x1="308" y1="76" x2="308" y2="105"/>
    <line x1="480" y1="76" x2="480" y2="105"/>
    <line x1="652" y1="76" x2="652" y2="105"/>
    <line x1="824" y1="76" x2="824" y2="105"/>
    <line x1="136" y1="105" x2="824" y2="105"/>
    <line x1="480" y1="105" x2="480" y2="140"/>
  </g>

  <rect x="300" y="140" width="360" height="56" rx="12" fill="#EEF2FF" stroke="#2F6BFF" stroke-width="2.5"/>
  <text class="txt ink" x="480" y="164" font-size="15" font-weight="700" text-anchor="middle">nanogateway</text>
  <text class="txt dim" x="480" y="183" font-size="11" text-anchor="middle">adapters · identity · inbound / outbound / stream</text>

  <g class="wire">
    <line x1="480" y1="196" x2="480" y2="225"/>
    <line x1="186" y1="225" x2="774" y2="225"/>
    <line x1="186" y1="225" x2="186" y2="250"/>
    <line x1="382" y1="225" x2="382" y2="250"/>
    <line x1="578" y1="225" x2="578" y2="250"/>
    <line x1="774" y1="225" x2="774" y2="250"/>
  </g>

  <g class="txt" text-anchor="middle">
    <rect class="card" x="96" y="250" width="180" height="46" rx="10"/><text class="ink" x="186" y="271" font-size="13" font-weight="600">nanobus</text><text class="dim" x="186" y="288" font-size="10.5">messages</text>
    <rect class="card" x="292" y="250" width="180" height="46" rx="10"/><text class="ink" x="382" y="271" font-size="13" font-weight="600">nanoauth</text><text class="dim" x="382" y="288" font-size="10.5">JWKS</text>
    <rect class="card" x="488" y="250" width="180" height="46" rx="10"/><text class="ink" x="578" y="271" font-size="13" font-weight="600">nanoadmin</text><text class="dim" x="578" y="288" font-size="10.5">channel config</text>
    <rect class="card" x="684" y="250" width="180" height="46" rx="10"/><text class="ink" x="774" y="271" font-size="13" font-weight="600">nanoportal</text><text class="dim" x="774" y="288" font-size="10.5">agent owner</text>
  </g>

  <text class="txt dim" x="480" y="336" font-size="11" text-anchor="middle">no database of its own: reconnect, restart or scale out at will — the bus holds the cursor</text>

  <rect x="186" y="362" width="588" height="34" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text class="txt dim" x="480" y="384" font-size="11" text-anchor="middle">/healthz · /metrics on the same port · acknowledgements configurable per channel</text>
</svg>
